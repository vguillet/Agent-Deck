<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agent Deck</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          13px system-ui,
          sans-serif;
      }
      body {
        margin: 12px;
        color: #eee;
        background: #2d2d2d;
      }
      section {
        margin-bottom: 18px;
      }
      h2 {
        margin: 0 0 10px;
        padding-bottom: 6px;
        color: #eee;
        border-bottom: 1px solid #555;
        font-size: 13px;
        font-weight: 600;
      }
      label {
        display: block;
        margin: 10px 0;
      }
      label span {
        display: block;
        margin-bottom: 4px;
        color: #bbb;
      }
      input,
      select {
        box-sizing: border-box;
        width: 100%;
        padding: 6px;
        color: #fff;
        background: #1e1e1e;
        border: 1px solid #555;
        border-radius: 4px;
      }
      label.checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      label.checkbox input {
        width: auto;
      }
      label.checkbox span {
        margin: 0;
      }
      #saveStatus {
        display: block;
        min-height: 1.4em;
        color: #aaa;
      }
      #saveStatus[data-error="true"] {
        color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <section id="actionSettings">
      <h2>Action</h2>
      <div id="agentSlotSettings" data-action-settings hidden>
        <label>
          <span>Slot override</span>
          <input
            id="slot"
            type="number"
            min="0"
            placeholder="Automatic key position"
          />
        </label>
        <label>
          <span>Agent key look</span>
          <select id="look">
            <option value="classic">Classic</option>
            <option value="agent">Agent characters</option>
          </select>
        </label>
      </div>
      <div id="agentSummarySettings" data-action-settings hidden>
        <label>
          <span>Recap scope</span>
          <select id="summaryProviderId">
            <option value="">All agents</option>
          </select>
        </label>
      </div>
      <div id="newAgentSettings" data-action-settings hidden>
        <label>
          <span>Agent provider</span>
          <select id="creationProviderId">
            <option value="cursor-local">Cursor</option>
            <option value="codex">Codex</option>
            <option value="claude-code">Claude Code</option>
          </select>
        </label>
      </div>
      <div id="providerUsageSettings" data-action-settings hidden>
        <label>
          <span>Provider</span>
          <select id="usageDefaultProviderId">
            <option value="codex">Codex</option>
            <option value="cursor-local">Cursor</option>
            <option value="claude-code">Claude Code</option>
          </select>
        </label>
      </div>
    </section>

    <section id="commonSettings">
      <h2>Common</h2>
      <label>
        <span>Core URL</span>
        <input id="serverUrl" value="http://127.0.0.1:47831" />
      </label>
      <label>
        <span>Device name</span>
        <input id="name" value="Stream Deck" />
      </label>
      <label>
        <span>Device role</span>
        <input id="role" value="agent-monitor" />
      </label>
      <label>
        <span>Provider IDs (comma-separated)</span>
        <input id="providers" />
      </label>
      <label class="checkbox">
        <input id="showSubagents" type="checkbox" />
        <span>Show running sub-agents</span>
      </label>
      <label>
        <span>Key visual theme</span>
        <select id="keyVisualTheme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">System</option>
        </select>
      </label>
      <output id="saveStatus"></output>
    </section>

    <script src="../bin/property-inspector.js"></script>
  </body>
</html>
